<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fisio Medic - Gran Inauguración</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500&display=swap');
*{box-sizing:border-box;}
body{margin:0;font-family:'Montserrat',sans-serif;background:#0A0A0A;color:#fff;text-align:center;padding:14px;}
.hero{padding:38px 18px 28px 18px;background:linear-gradient(180deg,#111,#000);border:1px solid #C9A86A;border-radius:28px;position:relative;overflow:hidden;}
.hero:before{content:'';position:absolute;inset:8px;border:1px solid rgba(201,168,106,0.45);border-radius:20px;pointer-events:none;}
.hero img{width:100%;max-width:400px;border-radius:18px;border:1px solid rgba(255,255,255,0.4);box-shadow:0 15px 40px rgba(0,0,0,0.6);}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:38px;margin:22px 0 2px 0;color:#E8D9B0;letter-spacing:6px;font-weight:600;}
.hero p{font-size:16px;color:#EDEDED;margin:4px 0;letter-spacing:2px;font-weight:300;}
.hero .fecha{font-size:15px;font-weight:500;color:#C9A86A;letter-spacing:2px;margin-top:10px;line-height:1.6;}
.divider{width:60px;height:1px;background:#C9A86A;margin:16px auto;}
.card,.black-card,.dress{position:relative;margin:16px 0;padding:48px 22px;border-radius:28px;overflow:hidden;border:1px solid #C9A86A;box-shadow:0 12px 35px rgba(0,0,0,0.45);}
.card:before,.black-card:before,.dress:before{content:'';position:absolute;inset:9px;border:1px solid rgba(201,168,106,0.55);border-radius:20px;pointer-events:none;z-index:2;}
.card{background:linear-gradient(rgba(0,0,0,0.58),rgba(0,0,0,0.68)), url('teesperamos.jpg');background-size:cover;background-position:center;}
.black-card{background:linear-gradient(rgba(0,0,0,0.62),rgba(0,0,0,0.72)), url('ubicación.jpg');background-size:cover;background-position:center;}
.dress{background:linear-gradient(rgba(0,0,0,0.62),rgba(0,0,0,0.70)), url('dress.jpg');background-size:cover;background-position:center;}
.card h2,.black-card h2,.dress h2{position:relative;z-index:3;font-family:'Cormorant Garamond',serif;font-size:32px;letter-spacing:4px;color:#D9BE7E;margin:0 0 14px 0;text-shadow:0 2px 12px #000;}
.card p,.black-card p{position:relative;z-index:3;font-size:16.5px;line-height:1.7;color:#F5F5F5;font-weight:300;text-shadow:0 2px 10px #000;}
.dress p{position:relative;z-index:3;font-size:16px;letter-spacing:4px;font-weight:400;}
.circles{position:relative;z-index:3;font-size:34px;letter-spacing:14px;margin:12px 0;}
